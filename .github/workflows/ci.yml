name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food_scanner_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      # The repo keeps only the Dart code; generate the Android project here.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org in.madtech --project-name food_scanner_mobile .
          rm -rf test
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Scan Before Use"/' "$manifest"
          # Release builds need these declared in the main manifest.
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' "$manifest"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: scan-before-use-apk
          path: food_scanner_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
